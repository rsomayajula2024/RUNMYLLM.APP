name: Weekly Model Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated models.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run model updater
        run: python scripts/update_models.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/models.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated models.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          git commit -m "chore: weekly model update $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "models.json is already up to date — no commit needed."
